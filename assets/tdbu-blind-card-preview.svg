<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">TDBU Blind Card preview</title>
  <desc id="description">A Home Assistant card controlling the top and bottom rails of a pleated blind.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="1" stop-color="#0d131a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc5dc"/>
      <stop offset="1" stop-color="#e9c58f"/>
    </linearGradient>
    <pattern id="pleats" width="8" height="12" patternUnits="userSpaceOnUse">
      <rect width="8" height="12" fill="#ddd6ca"/>
      <path d="M0 0h8M0 6h8" stroke="#b9b0a3" stroke-width="1" opacity=".8"/>
      <path d="M0 1h8" stroke="#f7f3ed" stroke-width="1" opacity=".75"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#background)"/>
  <circle cx="95" cy="86" r="120" fill="#03a9f4" opacity=".08"/>
  <circle cx="872" cy="530" r="180" fill="#7c4dff" opacity=".08"/>

  <g filter="url(#shadow)">
    <rect x="160" y="48" width="640" height="504" rx="24" fill="#202a35" stroke="#344454" stroke-width="2"/>
    <text x="480" y="98" fill="#f3f6f9" font-family="Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">Bedroom</text>

    <g transform="translate(220 128)">
      <rect x="0" y="0" width="390" height="300" rx="8" fill="url(#window)" stroke="#82919d" stroke-width="5"/>
      <path d="M195 2v296" stroke="#e6edf1" stroke-width="7" opacity=".65"/>
      <path d="M2 150h386" stroke="#e6edf1" stroke-width="7" opacity=".65"/>
      <path d="M20 270l85-80 56 49 72-91 137 122" fill="none" stroke="#4c7180" stroke-width="5" opacity=".38"/>

      <rect x="4" y="72" width="382" height="158" fill="url(#pleats)"/>
      <rect x="-7" y="65" width="404" height="14" rx="7" fill="#8b8177" stroke="#c9c0b7" stroke-width="2"/>
      <rect x="-7" y="223" width="404" height="14" rx="7" fill="#8b8177" stroke="#c9c0b7" stroke-width="2"/>

      <g font-family="Arial, sans-serif" font-size="17" fill="#dce5ec">
        <text x="-32" y="42" text-anchor="end">Top</text>
        <text x="-32" y="65" text-anchor="end" fill="#73c9f5">76%</text>
        <text x="-32" y="256" text-anchor="end">Bottom</text>
        <text x="-32" y="279" text-anchor="end" fill="#73c9f5">32%</text>
      </g>

      <line x1="-12" y1="72" x2="-12" y2="230" stroke="#7990a0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-12" cy="72" r="13" fill="#03a9f4" stroke="#d7f2ff" stroke-width="3"/>
      <circle cx="-12" cy="230" r="13" fill="#03a9f4" stroke="#d7f2ff" stroke-width="3"/>
    </g>

    <g transform="translate(650 173)" font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="45" cy="16" r="31" fill="#2d3c49" stroke="#526675" stroke-width="2"/>
      <path d="M45 3l-11 16h22z" fill="#f2f5f7"/>
      <circle cx="45" cy="88" r="31" fill="#2d3c49" stroke="#526675" stroke-width="2"/>
      <rect x="37" y="80" width="16" height="16" rx="2" fill="#f2f5f7"/>
      <circle cx="45" cy="160" r="31" fill="#2d3c49" stroke="#526675" stroke-width="2"/>
      <path d="M45 173l-11-16h22z" fill="#f2f5f7"/>
      <text x="45" y="214" fill="#b8c6d0" font-size="15">Both rails</text>
    </g>

    <text x="220" y="474" fill="#aebdca" font-family="Arial, sans-serif" font-size="17">Quick actions</text>
    <g transform="translate(220 491)" font-family="Arial, sans-serif" font-size="15" fill="#e9f0f4" text-anchor="middle">
      <rect x="0" y="0" width="92" height="36" rx="18" fill="#0b6f9f"/>
      <text x="46" y="23">Open</text>
      <rect x="102" y="0" width="104" height="36" rx="18" fill="#334451"/>
      <text x="154" y="23">Top strip</text>
      <rect x="216" y="0" width="82" height="36" rx="18" fill="#334451"/>
      <text x="257" y="23">Band</text>
      <rect x="308" y="0" width="112" height="36" rx="18" fill="#334451"/>
      <text x="364" y="23">Privacy</text>
    </g>
  </g>
</svg>
